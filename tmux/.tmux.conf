#Changes prefix to Ctrl+Space
unbind C-Space
set -g prefix C-Space
bind C-Space send-prefix

#Pane navigation
bind -n C-M-h select-pane -L
bind -n C-M-j select-pane -D
bind -n C-M-k select-pane -U
bind -n C-M-l select-pane -R

# use `y` in copy mode to send to clipboard
bind -T copy-mode-vi y send -X copy-pipe "xclip -i -selection clipboard"

#Enables mouse functionality
#set -g mouse on
setw -g mode-keys vi

#Marks a pane
bind \` switch-client -t'{marked}'

#Indexes panes and windows from 1
set -g base-index 1
setw -g pane-base-index 1

#Renumbers windows after deleting them
set -g renumber-windows on

#Remaps splitting
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key "\\" split-window -fh -c "#{pane_current_path}"

bind-key "-" split-window -v -c "#{pane_current_path}"
bind-key "_" split-window -fv -c "#{pane_current_path}"

#Swaps windows
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

#Preserves pwd when making new window
bind c new-window -c "#{pane_current_path}"

#Switches between previous and current window
bind Space last-window
#...session
bind-key C-Space switch-client -l

#Resizing the panes
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-h resize-pane -L 15
bind -r C-l resize-pane -R 15

#Join a pane from another into a different window
bind j choose-window 'join-pane -h -s "%%"'
bind J choose-window 'join-pane -s "%%"'

#Quick open notes
bind-key h split-window -h "nvim ~/tmp/notes.md"

#Revisit someday: https://builtin.com/articles/tmux-config

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.dotfiles/tmux/plugins/tpm/tpm'
