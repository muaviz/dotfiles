# Changes prefix to Ctrl+Space
unbind C-b
unbind C-Space
set -g prefix C-Space
bind C-Space send-prefix

# Pane navigation
bind -n C-M-h select-pane -L
bind -n C-M-j select-pane -D
bind -n C-M-k select-pane -U
bind -n C-M-l select-pane -R

# Vi mode and clipboard (native Wayland wl-copy)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# Enables mouse functionality
# set -g mouse on

#Marks a pane
bind \` switch-client -t'{marked}'

#Indexes panes and windows from 1
set -g base-index 1
setw -g pane-base-index 1

#Renumbers windows after deleting them
set -g renumber-windows on

#Remaps splitting
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key "\\" split-window -fh -c "#{pane_current_path}"

bind-key "-" split-window -v -c "#{pane_current_path}"
bind-key "_" split-window -fv -c "#{pane_current_path}"

#Swaps windows
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

#Preserves pwd when making new window
bind c new-window -c "#{pane_current_path}"

#Switches between previous and current window
bind Space last-window
#...session
bind-key C-Space switch-client -l

#Resizing the panes
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-h resize-pane -L 15
bind -r C-l resize-pane -R 15

#Join a pane from another into a different window
bind j choose-window 'join-pane -h -s "%%"'
bind J choose-window 'join-pane -s "%%"'

# Quick open notes
bind-key h split-window -h "nvim ~/tmp/notes.md"

# Fuzzy project session switcher (popup)
bind-key -r f display-popup -E -w 75% -h 65% "~/.local/bin/tmux-sessionizer"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'

# Resurrect & Continuum configurations
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

# Thumbs configuration (Press Prefix + F to copy hints without mouse)
set -g @thumbs-key F
set -g @thumbs-command 'echo -n {} | wl-copy'
set -g @thumbs-upcase-command 'echo -n {} | wl-copy'

# Terminal & True color support
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",*:Tc"

# Gruvbox Material theme (Minimal, transparent status bar harmonizing with Neovim & Ghostty)
set -g status on
set -g status-position bottom
set -g status-style "bg=default,fg=#928374"

# Left: Window tabs (clean text, no bulky boxes)
set -g status-left ""
set -g status-left-length 30
setw -g window-status-format "#[fg=#7c6f64] #I:#W#{?window_zoomed_flag, 󰁌,} "
setw -g window-status-current-format "#[fg=#c37d38,bold] #I:#W#{?window_zoomed_flag, 󰁌,} #[fg=#7c6f64]"
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=#d8a657"
setw -g window-status-bell-style "fg=#ea6962,bold"

# Right: Clean, minimal session name with prefix indicator
set -g status-right "#{?client_prefix,#[fg=#ea6962]󰌌 ,}#[fg=#c37d38,bold]󰇄 #S "
set -g status-right-length 50

# Clean pane borders (dark charcoal inactive, warm charcoal-amber active)
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#c37d38"

# Command line / message bar (Gruvbox charcoal background with amber text)
set -g message-style "bg=#3c3836,fg=#c37d38,bold,fill=#3c3836"
set -g message-command-style "bg=#3c3836,fg=#c37d38,bold,fill=#3c3836"

# Copy mode selection styling (matches Gruvbox visual highlight)
set -g mode-style "bg=#504945,fg=#fbf1c7,bold"

# Popup window styling (matches Gruvbox borders)
set -g popup-border-style "fg=#504945"
set -g popup-border-lines rounded

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
