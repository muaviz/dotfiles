# Changes prefix to Ctrl+Space
unbind C-b
unbind C-Space
set -g prefix C-Space
bind C-Space send-prefix

# Pane navigation
bind -n C-M-h select-pane -L
bind -n C-M-j select-pane -D
bind -n C-M-k select-pane -U
bind -n C-M-l select-pane -R

# Vi mode and clipboard (native Wayland wl-copy)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# Enables mouse functionality
# set -g mouse on

#Marks a pane
bind \` switch-client -t'{marked}'

#Indexes panes and windows from 1
set -g base-index 1
setw -g pane-base-index 1

#Renumbers windows after deleting them
set -g renumber-windows on

#Remaps splitting
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key "\\" split-window -fh -c "#{pane_current_path}"

bind-key "-" split-window -v -c "#{pane_current_path}"
bind-key "_" split-window -fv -c "#{pane_current_path}"

#Swaps windows
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

#Preserves pwd when making new window
bind c new-window -c "#{pane_current_path}"

#Switches between previous and current window
bind Space last-window
#...session
bind-key C-Space switch-client -l

#Resizing the panes
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-h resize-pane -L 15
bind -r C-l resize-pane -R 15

#Join a pane from another into a different window
bind j choose-window 'join-pane -h -s "%%"'
bind J choose-window 'join-pane -s "%%"'

# Quick open notes
bind-key h split-window -h "nvim ~/tmp/notes.md"

# Fuzzy project session switcher (popup)
bind-key -r f display-popup -E -w 75% -h 65% "~/.local/bin/tmux-sessionizer"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'

# Resurrect & Continuum configurations
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

# Thumbs configuration (Press Prefix + F to copy hints without mouse)
set -g @thumbs-key F
set -g @thumbs-command 'echo -n {} | wl-copy'
set -g @thumbs-upcase-command 'echo -n {} | wl-copy'

# Minimal, transparent status bar (harmonizes with Neovim & transparent terminal)
set -g status on
set -g status-position bottom
set -g status-style "bg=default,fg=#6c7086"

# Left: Window tabs (clean text, no bulky boxes)
set -g status-left ""
set -g status-left-length 30
setw -g window-status-format "#[fg=#585b70] #I:#W "
setw -g window-status-current-format "#[fg=#89b4fa,bold] #I:#W #[fg=#585b70]"
setw -g window-status-separator ""

# Right: Clean, minimal session name (avoids duplicating Neovim's status)
set -g status-right "#[fg=#89b4fa,bold]󰇄 #S "
set -g status-right-length 50

# Clean pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Command line / message bar (fill ensures tmux clears the entire line)
set -g message-style "bg=#181825,fg=#89b4fa,bold,fill=#181825"
set -g message-command-style "bg=#181825,fg=#89b4fa,bold,fill=#181825"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
